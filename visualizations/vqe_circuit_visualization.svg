<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250" role="img" aria-labelledby="title desc">
  <title id="title">Variational quantum circuit architectures</title>
  <desc id="desc">Monochrome scientific figure of the HVA and HEA circuits implemented for a 30-qubit de-escalation portfolio optimization problem.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111"/>
    </marker>
    <style>
      text { fill: #111; font-family: "Times New Roman", Times, serif; }
      .title { font-size: 34px; font-weight: 600; text-anchor: middle; }
      .subtitle { font-size: 20px; text-anchor: middle; }
      .panel-title { font-size: 28px; font-weight: 600; }
      .panel-note { font-size: 18px; }
      .wire-label { font-size: 19px; font-style: italic; text-anchor: end; dominant-baseline: middle; }
      .gate-label { font-size: 16px; text-anchor: middle; dominant-baseline: middle; }
      .small-label { font-size: 15px; text-anchor: middle; dominant-baseline: middle; }
      .stage { font-size: 17px; font-variant: small-caps; letter-spacing: .7px; text-anchor: middle; }
      .formula { font-size: 20px; }
      .caption { font-size: 17px; }
      .caption-strong { font-size: 17px; font-weight: 600; }
      .wire { stroke: #111; stroke-width: 1.8; fill: none; }
      .thin { stroke: #111; stroke-width: 1.2; fill: none; }
      .gate { fill: #fff; stroke: #111; stroke-width: 1.7; }
      .boundary { fill: none; stroke: #444; stroke-width: 1.2; stroke-dasharray: 7 6; }
      .separator { stroke: #777; stroke-width: 1; }
      .control { fill: #111; stroke: #111; }
      .target { fill: #fff; stroke: #111; stroke-width: 1.8; }
    </style>
  </defs>

  <rect width="1800" height="1250" fill="#fff"/>

  <text x="900" y="48" class="title">Variational Quantum Circuit Architectures</text>
  <text x="900" y="80" class="subtitle">De-escalation portfolio optimization: m = 30 qubits, circuit depth p = 2</text>
  <line x1="70" y1="103" x2="1730" y2="103" class="separator"/>

  <!-- (a) HVA -->
  <text x="75" y="145" class="panel-title">(a) Hamiltonian variational ansatz (HVA)</text>
  <text x="1725" y="145" class="panel-note" text-anchor="end">4 shared variational parameters</text>

  <!-- HVA stage labels and boundaries -->
  <text x="225" y="188" class="stage">Initialization</text>
  <text x="505" y="188" class="stage">Local field</text>
  <text x="920" y="188" class="stage">Pairwise Ising coupling</text>
  <text x="1320" y="188" class="stage">Mixer</text>
  <text x="1600" y="188" class="stage">Sampling</text>
  <rect x="365" y="202" width="1065" height="290" class="boundary"/>
  <text x="897" y="515" class="panel-note" text-anchor="middle">one variational layer r; repeat for r = 1, 2</text>

  <!-- HVA wires -->
  <g>
    <text x="112" y="238" class="wire-label">q₀</text><line x1="130" y1="238" x2="1685" y2="238" class="wire"/>
    <text x="112" y="286" class="wire-label">q₁</text><line x1="130" y1="286" x2="1685" y2="286" class="wire"/>
    <text x="112" y="334" class="wire-label">q₂</text><line x1="130" y1="334" x2="1685" y2="334" class="wire"/>
    <text x="105" y="375" class="wire-label">⋮</text>
    <text x="112" y="416" class="wire-label">q₂₈</text><line x1="130" y1="416" x2="1685" y2="416" class="wire"/>
    <text x="112" y="464" class="wire-label">q₂₉</text><line x1="130" y1="464" x2="1685" y2="464" class="wire"/>
  </g>

  <!-- HVA Hadamard gates -->
  <g>
    <rect x="203" y="218" width="44" height="40" class="gate"/><text x="225" y="239" class="gate-label">H</text>
    <rect x="203" y="266" width="44" height="40" class="gate"/><text x="225" y="287" class="gate-label">H</text>
    <rect x="203" y="314" width="44" height="40" class="gate"/><text x="225" y="335" class="gate-label">H</text>
    <rect x="203" y="396" width="44" height="40" class="gate"/><text x="225" y="417" class="gate-label">H</text>
    <rect x="203" y="444" width="44" height="40" class="gate"/><text x="225" y="465" class="gate-label">H</text>
  </g>

  <!-- HVA local-field rotations -->
  <g>
    <rect x="414" y="218" width="182" height="40" class="gate"/><text x="505" y="239" class="small-label">R<tspan baseline-shift="sub">Z</tspan>(2γ<tspan baseline-shift="sub">r</tspan>g₀)</text>
    <rect x="414" y="266" width="182" height="40" class="gate"/><text x="505" y="287" class="small-label">R<tspan baseline-shift="sub">Z</tspan>(2γ<tspan baseline-shift="sub">r</tspan>g₁)</text>
    <rect x="414" y="314" width="182" height="40" class="gate"/><text x="505" y="335" class="small-label">R<tspan baseline-shift="sub">Z</tspan>(2γ<tspan baseline-shift="sub">r</tspan>g₂)</text>
    <rect x="414" y="396" width="182" height="40" class="gate"/><text x="505" y="417" class="small-label">R<tspan baseline-shift="sub">Z</tspan>(2γ<tspan baseline-shift="sub">r</tspan>g₂₈)</text>
    <rect x="414" y="444" width="182" height="40" class="gate"/><text x="505" y="465" class="small-label">R<tspan baseline-shift="sub">Z</tspan>(2γ<tspan baseline-shift="sub">r</tspan>g₂₉)</text>
  </g>

  <!-- HVA representative ZZ decomposition for q0,q1 -->
  <g>
    <line x1="670" y1="238" x2="670" y2="286" class="wire"/>
    <circle cx="670" cy="238" r="6" class="control"/>
    <circle cx="670" cy="286" r="14" class="target"/>
    <line x1="659" y1="286" x2="681" y2="286" class="thin"/><line x1="670" y1="275" x2="670" y2="297" class="thin"/>
    <rect x="712" y="266" width="174" height="40" class="gate"/><text x="799" y="287" class="small-label">R<tspan baseline-shift="sub">Z</tspan>(2γ<tspan baseline-shift="sub">r</tspan>K₀₁)</text>
    <line x1="928" y1="238" x2="928" y2="286" class="wire"/>
    <circle cx="928" cy="238" r="6" class="control"/>
    <circle cx="928" cy="286" r="14" class="target"/>
    <line x1="917" y1="286" x2="939" y2="286" class="thin"/><line x1="928" y1="275" x2="928" y2="297" class="thin"/>
  </g>

  <!-- HVA representative ZZ decomposition for q2,q29 -->
  <g>
    <line x1="980" y1="334" x2="980" y2="464" class="wire"/>
    <circle cx="980" cy="334" r="6" class="control"/>
    <circle cx="980" cy="464" r="14" class="target"/>
    <line x1="969" y1="464" x2="991" y2="464" class="thin"/><line x1="980" y1="453" x2="980" y2="475" class="thin"/>
    <rect x="1018" y="444" width="186" height="40" class="gate"/><text x="1111" y="465" class="small-label">R<tspan baseline-shift="sub">Z</tspan>(2γ<tspan baseline-shift="sub">r</tspan>K₂,₂₉)</text>
    <line x1="1238" y1="334" x2="1238" y2="464" class="wire"/>
    <circle cx="1238" cy="334" r="6" class="control"/>
    <circle cx="1238" cy="464" r="14" class="target"/>
    <line x1="1227" y1="464" x2="1249" y2="464" class="thin"/><line x1="1238" y1="453" x2="1238" y2="475" class="thin"/>
  </g>
  <text x="951" y="369" class="panel-note" text-anchor="middle">⋯ all nonzero pairs k &lt; ℓ ⋯</text>
  <text x="951" y="395" class="panel-note" text-anchor="middle">up to C(30,2) = 435 ZZ blocks per layer</text>

  <!-- HVA mixer gates -->
  <g>
    <rect x="1275" y="218" width="90" height="40" class="gate"/><text x="1320" y="239" class="small-label">R<tspan baseline-shift="sub">X</tspan>(2β<tspan baseline-shift="sub">r</tspan>)</text>
    <rect x="1275" y="266" width="90" height="40" class="gate"/><text x="1320" y="287" class="small-label">R<tspan baseline-shift="sub">X</tspan>(2β<tspan baseline-shift="sub">r</tspan>)</text>
    <rect x="1275" y="314" width="90" height="40" class="gate"/><text x="1320" y="335" class="small-label">R<tspan baseline-shift="sub">X</tspan>(2β<tspan baseline-shift="sub">r</tspan>)</text>
    <rect x="1275" y="396" width="90" height="40" class="gate"/><text x="1320" y="417" class="small-label">R<tspan baseline-shift="sub">X</tspan>(2β<tspan baseline-shift="sub">r</tspan>)</text>
    <rect x="1275" y="444" width="90" height="40" class="gate"/><text x="1320" y="465" class="small-label">R<tspan baseline-shift="sub">X</tspan>(2β<tspan baseline-shift="sub">r</tspan>)</text>
  </g>

  <!-- HVA repetition and measurement abstraction -->
  <path d="M1400 215 h18 v267 h-18" class="wire"/>
  <text x="1443" y="350" class="panel-note">× 2</text>
  <rect x="1532" y="306" width="136" height="58" class="gate"/>
  <path d="M1554 348 A36 36 0 0 1 1646 326 M1600 348 l27 -18" class="thin"/>
  <text x="1600" y="390" class="panel-note" text-anchor="middle">N<tspan baseline-shift="sub">shots</tspan> = 2000</text>

  <!-- HVA exact sequence -->
  <text x="130" y="552" class="formula">H<tspan baseline-shift="super">⊗m</tspan> → [ ∏<tspan baseline-shift="sub">k</tspan> R<tspan baseline-shift="sub">Z,k</tspan>(2γ<tspan baseline-shift="sub">r</tspan>g<tspan baseline-shift="sub">k</tspan>) → ∏<tspan baseline-shift="sub">k&lt;ℓ</tspan> CNOT<tspan baseline-shift="sub">k,ℓ</tspan> R<tspan baseline-shift="sub">Z,ℓ</tspan>(2γ<tspan baseline-shift="sub">r</tspan>K<tspan baseline-shift="sub">kℓ</tspan>) CNOT<tspan baseline-shift="sub">k,ℓ</tspan> → ∏<tspan baseline-shift="sub">k</tspan> R<tspan baseline-shift="sub">X,k</tspan>(2β<tspan baseline-shift="sub">r</tspan>) ]<tspan baseline-shift="sub">r=1,2</tspan></text>
  <line x1="70" y1="585" x2="1730" y2="585" class="separator"/>

  <!-- (b) HEA -->
  <text x="75" y="630" class="panel-title">(b) Hardware-efficient ansatz (HEA)</text>
  <text x="1725" y="630" class="panel-note" text-anchor="end">m + 2mp = 150 independent parameters</text>

  <text x="275" y="674" class="stage">Initial rotation</text>
  <text x="630" y="674" class="stage">Parameterized rotations</text>
  <text x="1110" y="674" class="stage">Ring entanglement</text>
  <text x="1600" y="674" class="stage">Sampling</text>
  <rect x="435" y="688" width="1000" height="290" class="boundary"/>
  <text x="935" y="1001" class="panel-note" text-anchor="middle">one hardware-efficient layer r; repeat for r = 1, 2</text>

  <!-- HEA wires -->
  <g>
    <text x="112" y="724" class="wire-label">q₀</text><line x1="130" y1="724" x2="1685" y2="724" class="wire"/>
    <text x="112" y="772" class="wire-label">q₁</text><line x1="130" y1="772" x2="1685" y2="772" class="wire"/>
    <text x="112" y="820" class="wire-label">q₂</text><line x1="130" y1="820" x2="1685" y2="820" class="wire"/>
    <text x="105" y="861" class="wire-label">⋮</text>
    <text x="112" y="902" class="wire-label">q₂₈</text><line x1="130" y1="902" x2="1685" y2="902" class="wire"/>
    <text x="112" y="950" class="wire-label">q₂₉</text><line x1="130" y1="950" x2="1685" y2="950" class="wire"/>
  </g>

  <!-- HEA initial rotations -->
  <g>
    <rect x="207" y="704" width="136" height="40" class="gate"/><text x="275" y="725" class="small-label">R<tspan baseline-shift="sub">Y</tspan>(θ₀,₀)</text>
    <rect x="207" y="752" width="136" height="40" class="gate"/><text x="275" y="773" class="small-label">R<tspan baseline-shift="sub">Y</tspan>(θ₀,₁)</text>
    <rect x="207" y="800" width="136" height="40" class="gate"/><text x="275" y="821" class="small-label">R<tspan baseline-shift="sub">Y</tspan>(θ₀,₂)</text>
    <rect x="207" y="882" width="136" height="40" class="gate"/><text x="275" y="903" class="small-label">R<tspan baseline-shift="sub">Y</tspan>(θ₀,₂₈)</text>
    <rect x="207" y="930" width="136" height="40" class="gate"/><text x="275" y="951" class="small-label">R<tspan baseline-shift="sub">Y</tspan>(θ₀,₂₉)</text>
  </g>

  <!-- HEA per-layer rotations -->
  <g>
    <rect x="482" y="704" width="128" height="40" class="gate"/><text x="546" y="725" class="small-label">R<tspan baseline-shift="sub">Y</tspan>(θ<tspan baseline-shift="sub">r,0</tspan>)</text>
    <rect x="482" y="752" width="128" height="40" class="gate"/><text x="546" y="773" class="small-label">R<tspan baseline-shift="sub">Y</tspan>(θ<tspan baseline-shift="sub">r,1</tspan>)</text>
    <rect x="482" y="800" width="128" height="40" class="gate"/><text x="546" y="821" class="small-label">R<tspan baseline-shift="sub">Y</tspan>(θ<tspan baseline-shift="sub">r,2</tspan>)</text>
    <rect x="482" y="882" width="128" height="40" class="gate"/><text x="546" y="903" class="small-label">R<tspan baseline-shift="sub">Y</tspan>(θ<tspan baseline-shift="sub">r,28</tspan>)</text>
    <rect x="482" y="930" width="128" height="40" class="gate"/><text x="546" y="951" class="small-label">R<tspan baseline-shift="sub">Y</tspan>(θ<tspan baseline-shift="sub">r,29</tspan>)</text>
    <rect x="650" y="704" width="128" height="40" class="gate"/><text x="714" y="725" class="small-label">R<tspan baseline-shift="sub">Z</tspan>(φ<tspan baseline-shift="sub">r,0</tspan>)</text>
    <rect x="650" y="752" width="128" height="40" class="gate"/><text x="714" y="773" class="small-label">R<tspan baseline-shift="sub">Z</tspan>(φ<tspan baseline-shift="sub">r,1</tspan>)</text>
    <rect x="650" y="800" width="128" height="40" class="gate"/><text x="714" y="821" class="small-label">R<tspan baseline-shift="sub">Z</tspan>(φ<tspan baseline-shift="sub">r,2</tspan>)</text>
    <rect x="650" y="882" width="128" height="40" class="gate"/><text x="714" y="903" class="small-label">R<tspan baseline-shift="sub">Z</tspan>(φ<tspan baseline-shift="sub">r,28</tspan>)</text>
    <rect x="650" y="930" width="128" height="40" class="gate"/><text x="714" y="951" class="small-label">R<tspan baseline-shift="sub">Z</tspan>(φ<tspan baseline-shift="sub">r,29</tspan>)</text>
  </g>

  <!-- HEA ring CNOTs -->
  <g>
    <line x1="850" y1="724" x2="850" y2="772" class="wire"/><circle cx="850" cy="724" r="6" class="control"/><circle cx="850" cy="772" r="14" class="target"/><line x1="839" y1="772" x2="861" y2="772" class="thin"/><line x1="850" y1="761" x2="850" y2="783" class="thin"/>
    <line x1="950" y1="772" x2="950" y2="820" class="wire"/><circle cx="950" cy="772" r="6" class="control"/><circle cx="950" cy="820" r="14" class="target"/><line x1="939" y1="820" x2="961" y2="820" class="thin"/><line x1="950" y1="809" x2="950" y2="831" class="thin"/>
    <text x="1080" y="846" class="panel-note" text-anchor="middle">⋯ nearest-neighbor chain ⋯</text>
    <line x1="1190" y1="861" x2="1190" y2="902" class="wire"/><circle cx="1190" cy="861" r="6" class="control"/><circle cx="1190" cy="902" r="14" class="target"/><line x1="1179" y1="902" x2="1201" y2="902" class="thin"/><line x1="1190" y1="891" x2="1190" y2="913" class="thin"/>
    <line x1="1280" y1="902" x2="1280" y2="950" class="wire"/><circle cx="1280" cy="902" r="6" class="control"/><circle cx="1280" cy="950" r="14" class="target"/><line x1="1269" y1="950" x2="1291" y2="950" class="thin"/><line x1="1280" y1="939" x2="1280" y2="961" class="thin"/>
    <path d="M1360 950 C1410 950 1410 724 1360 724" class="wire"/>
    <circle cx="1360" cy="950" r="6" class="control"/><circle cx="1360" cy="724" r="14" class="target"/><line x1="1349" y1="724" x2="1371" y2="724" class="thin"/><line x1="1360" y1="713" x2="1360" y2="735" class="thin"/>
    <text x="1375" y="840" class="panel-note" text-anchor="end">q₂₉ → q₀</text>
  </g>
  <path d="M1405 701 h18 v267 h-18" class="wire"/>
  <text x="1445" y="836" class="panel-note">× 2</text>

  <!-- HEA measurement abstraction -->
  <rect x="1532" y="792" width="136" height="58" class="gate"/>
  <path d="M1554 834 A36 36 0 0 1 1646 812 M1600 834 l27 -18" class="thin"/>
  <text x="1600" y="876" class="panel-note" text-anchor="middle">N<tspan baseline-shift="sub">shots</tspan> = 2000</text>

  <!-- Comparison and caption -->
  <line x1="70" y1="1035" x2="1730" y2="1035" class="separator"/>
  <text x="75" y="1075" class="caption-strong">Circuit summary.</text>
  <text x="210" y="1075" class="caption">HVA uses a problem-informed, fully connected Ising cost layer with two shared parameters per depth.</text>
  <text x="75" y="1104" class="caption">HEA uses independent single-qubit rotations followed by a 30-CNOT directed ring. Only five representative wires are shown;</text>
  <text x="75" y="1133" class="caption">the omitted wires follow the same pattern. The transverse-field coefficient γ<tspan baseline-shift="sub">tf</tspan> = 0.2 enters the energy observable, not as a separate ansatz gate.</text>

  <rect x="70" y="1167" width="1660" height="52" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="92" y="1199" class="caption"><tspan font-weight="600">Implementation:</tspan> src/qulacs_vqe.py::{build_hva_circuit, build_hea_circuit}    |    production configuration: remote/sim-{hva,hea}.job</text>
</svg>
